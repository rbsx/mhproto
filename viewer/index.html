<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MHProto</title>
    <meta
      name="description"
      content="A shared contract for humans and agents: linked behaviour, API types, examples and verification."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='white'/%3E%3Ctext x='3' y='43' font-family='monospace' font-size='26' font-weight='700' fill='%23141414'%3E%5Bmh%5D%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" id="home" href="https://mhproto.dev/" aria-label="MHProto homepage"
        ><span class="brand-mark">[mh]</span><span>mhproto</span></a
      >
      <div class="nav-label">Project</div>
      <div id="project-name" class="project-name">Loading…</div>
      <div class="nav-label">Features</div>
      <nav id="features" aria-label="Features"></nav>
      <div class="sidebar-footer">
        <a id="changes-link" href="#/changes">Changes</a><a id="sources-link" href="#">Sources</a
        ><button id="save-preview" class="text-button" hidden>Save preview</button
        ><span id="view-mode"></span>
      </div>
    </aside>
    <main>
      <div class="search-row">
        <label class="sr-only" for="search">Search this project</label
        ><input
          id="search"
          type="search"
          placeholder="Search this project…"
          autocomplete="off"
        /><kbd>/</kbd>
      </div>
      <div id="content" aria-live="polite">Loading…</div>
      <footer class="page-footer">
        <span id="freshness"></span><span id="read-mode">Read-only</span>
      </footer>
    </main>
    <script src="/vendor/mermaid.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
