<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIVE</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#">bive</a>
    <div id="project-name" class="project-name">Loading…</div>
    <div class="nav-label">Capabilities</div>
    <nav id="capabilities" aria-label="Capabilities"></nav>
    <div class="sidebar-footer"><a href="#" data-kind="system" data-id="system">System map</a><span id="view-mode">Local workspace</span></div>
  </aside>
  <main>
    <div class="topline"><span id="breadcrumb">Capability</span><a href="#" data-kind="sources" data-id="sources">Sources</a></div>
    <header><h1 id="title">Loading…</h1><p id="subtitle"></p></header>
    <nav id="tabs" aria-label="Capability views"></nav>
    <div class="search-row"><label class="sr-only" for="search">Search this capability</label><input id="search" type="search" placeholder="Search this capability…" autocomplete="off"><span class="shortcut">/</span></div>
    <div id="content" aria-live="polite"></div>
    <footer class="page-footer"><span id="freshness"></span><span id="read-mode">Read-only</span></footer>
  </main>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="detail-toolbar"><button id="detail-back" type="button" hidden>← Back</button><span id="detail-label"></span><button class="close" type="button" aria-label="Close details">×</button></div>
    <div id="detail-content"></div>
  </dialog>
  <script type="module" src="/app.js"></script>
</body></html>
